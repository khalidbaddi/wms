apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-ai
  template:
    metadata:
      labels:
        app: k8s-ai
    spec:
      containers:
      - name: k8s-ai
        image: yourrepo/k8s-ai:v1
        ports:
        - containerPort: 8000